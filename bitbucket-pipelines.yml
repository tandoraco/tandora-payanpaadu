image: python:3.8

pipelines:
  default:
  - step:
     name: Deploy to test
     deployment: test
     script:
       - echo "Deploying to test environment"
  - step:
     name: Upload to AWS
     trigger: manual
     script:
       - pip install -r requirements.txt
       - python setup.py sdist
       - python manage.py upload_payanpaadu
